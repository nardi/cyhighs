name: Tests

# Run the linting checks and the test suite on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Type check
        run: uv run ty check

  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # The benchmark tracking step pushes history to a data branch on main and
    # comments on pull requests, so the job needs write access to both.
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync environment and build the extension
        run: uv sync
      - name: Run tests
        run: uv run pytest
      # Run the performance benchmarks once per operating system, reusing the
      # extension already built above. One Python version is enough, since the
      # benchmarks measure the compiled solver rather than the Python layer.
      - name: Run benchmarks
        if: matrix.python-version == '3.12'
        run: uv run pytest benchmarks --benchmark-json=benchmark.json
      # Compare against the stored history and comment on regressions. Each
      # operating system tracks its own series on its own data branch, since
      # absolute timings differ per platform and a shared branch would race when
      # the three jobs push on main. The alert is advisory and never fails the
      # build, because hosted runners are too noisy for a hard threshold.
      - name: Track benchmark regressions
        if: matrix.python-version == '3.12'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: benchmarks-${{ matrix.os }}
          tool: pytest
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmarks-${{ matrix.os }}
          benchmark-data-dir-path: dev/bench
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: false
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
