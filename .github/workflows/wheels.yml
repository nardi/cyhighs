name: Build wheels

# Build a matrix of binary wheels and a source distribution. Runs on tags, on
# manual dispatch, and when the build configuration changes on a pull request.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "CMakeLists.txt"
      - ".github/workflows/wheels.yml"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per platform and architecture. Linux aarch64 and macOS
        # arm64 use native runners so that no emulation is needed.
        os:
          - ubuntu-latest      # Linux x86_64 (manylinux and musllinux)
          - ubuntu-24.04-arm   # Linux aarch64
          - macos-13           # macOS x86_64
          - macos-latest       # macOS arm64
          - windows-latest     # Windows AMD64
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          # Build CPython 3.11 through 3.14. The free threaded builds are left
          # out for now while Cython support for them is still settling.
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_i686 *_i686"
          # HiGHS is C++17. Pin the macOS deployment target per architecture,
          # since arm64 requires at least 11.0 while x86_64 needs 10.15 for the
          # C++17 standard library features HiGHS relies on.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-13' && '10.15' || '11.0' }}
          # Verify each freshly built wheel by running the test suite against it.
          CIBW_TEST_REQUIRES: "pytest scipy"
          CIBW_TEST_COMMAND: "pytest {project}/tests"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist
        run: uv build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
