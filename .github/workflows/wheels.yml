name: Build wheels

# Build a matrix of binary wheels and a source distribution. Runs on tags, on
# manual dispatch, when the build configuration changes on a pull request, and
# when a GitHub release is published, which also triggers the PyPI publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "meson.build"
      - "subprojects/**"
      - ".github/workflows/wheels.yml"
  release:
    types: [published]

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every wheel flavor builds the same way now (see meson.build): HiGHS +
  # HiPO, OpenBLAS, and libblastrampoline are all consumed as prebuilt JLL
  # binaries rather than compiled from source. That means a single
  # cibuildwheel job with an OS matrix covers every platform, with
  # cibuildwheel picking the right container (manylinux_2_28/musllinux_1_2 on
  # Linux) or native toolchain (macOS, Windows) per matrix entry.
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04       # Linux x86_64 -> manylinux_2_28 + musllinux_1_2
          - ubuntu-24.04-arm   # Linux aarch64 -> manylinux_2_28 + musllinux_1_2
          - macos-latest       # macOS arm64
          - windows-latest     # Windows AMD64
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          # Build CPython 3.11 through 3.14. The free threaded builds are left
          # out for now while Cython support for them is still settling.
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          # Skip 32-bit targets. HiGHS is not viable on 32-bit and there are no
          # 32-bit SciPy wheels for the test step. "*-win32" is a no-op outside
          # the Windows matrix entry.
          CIBW_SKIP: "*_i686 *-win32"
          # HiGHS is C++17. macOS arm64 requires a deployment target of at
          # least 11.0 for the C++17 standard library features HiGHS relies
          # on. Unused outside the macOS matrix entry.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # The JLL-provided binaries (libhighs, the bundled CompilerSupportLibraries
          # libstdc++/libgfortran, ...) were built with a newer GCC than the
          # default manylinux_2_28 (AlmaLinux 8) container's policy allows:
          # auditwheel refuses to repair the wheel, citing "too-recent
          # versioned symbols". manylinux_2_34 (AlmaLinux 9) has a high enough
          # ceiling. Unused outside the Linux matrix entries (musllinux is
          # unaffected, since musl has no comparable symbol versioning).
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
          # -v: diagnose an "ELFError: Magic number does not match" crash in
          # auditwheel's own dependency-tree walk (a file it's resolving a
          # SONAME against isn't a real ELF -- likely a linker-script stand-in
          # for one of manylinux_2_34's system libraries, but the default,
          # non-verbose output does not name which one). Drop once diagnosed.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -v -w {dest_dir} {wheel}"
          # Verify each freshly built wheel by running the test suite against
          # it. pytest-markdown-docs is required because the project addopts
          # enable it, and it lets the documentation examples run against the
          # built wheel too.
          CIBW_TEST_REQUIRES: "pytest scipy pytest-markdown-docs"
          CIBW_TEST_COMMAND: "pytest {project}/tests {project}/docs"
          # scipy does not publish musllinux wheels for every CPython yet, so
          # the in-container test install can fail there. The wheels are
          # still built; drop this once scipy musllinux coverage is confirmed
          # for all targets. Unused outside the Linux matrix entries.
          CIBW_TEST_SKIP: "*-musllinux_*"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install sdist build dependencies
        # pyproject.toml sets [tool.uv] no-build-isolation-package = ["cyhighs"]
        # (see the comment there), so `uv build` will not create an isolated
        # build environment for cyhighs and instead expects meson-python to
        # already be importable in the active environment.
        run: uv venv && uv pip install meson-python cython
      - name: Build sdist
        run: uv build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cyhighs/
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
