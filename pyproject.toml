[build-system]
# meson-python drives a Meson build. HiGHS is linked as a prebuilt binary
# through the HiGHS_jll Julia package (see meson.build and subprojects/), so
# no C++ compiler or HiGHS source compile is required, only a C compiler for
# our own Cython-generated extension. Meson transpiles the .pyx source to C
# directly (see meson.build's cython_args), and meson plus ninja are pulled
# in as PyPI wheels through meson-python.
requires = ["meson-python>=0.16", "cython>=3.0"]
build-backend = "mesonpy"

[tool.meson-python]
# Windows has no RPATH equivalent, so meson-python cannot point _core at the
# JLL-provided runtime DLLs (libhighs, libblastrampoline, the bundled
# OpenBLAS, libgfortran) the way it does automatically on Linux/macOS.
# Opting in here hands that responsibility to cyhighs itself: __init__.py
# calls os.add_dll_directory() to extend the DLL search path before
# importing _core, see the comment there.
allow-windows-internal-shared-libs = true

[project]
name = "cyhighs"
version = "0.2.2"
description = "Cython bindings to the HiGHS linear and mixed integer optimization solver"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nardi Lam", email = "mail@nardilam.nl" }]
keywords = ["linear programming", "optimization", "solver", "HiGHS", "linprog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Minimum versions are kept as low as the Python 3.11 floor allows. numpy 1.23.2
# and scipy 1.9.2 are the first releases to publish CPython 3.11 wheels, and the
# bindings deliberately avoid the numpy C API so there is no tighter coupling.
dependencies = ["numpy>=1.23.2", "scipy>=1.9.2"]

[project.optional-dependencies]
# HiGHS's BLAS calls are forwarded through libblastrampoline at runtime (see
# src/cyhighs/_blas_backend.py), so swapping in Intel MKL is just a matter of
# having its runtime library present -- no cyhighs rebuild needed. Intel's
# `mkl` wheel is only published for Linux x86_64 and Windows x86_64 (Intel has
# never shipped MKL for macOS or for any ARM target), so the environment
# marker below makes `pip install cyhighs[mkl]` fail clearly on unsupported
# platforms instead of silently installing nothing.
mkl = ["mkl; (platform_system == 'Linux' or platform_system == 'Windows') and platform_machine in 'x86_64 AMD64'"]

[project.urls]
Homepage = "https://github.com/nardilam/cyhighs"
Repository = "https://github.com/nardilam/cyhighs"

[dependency-groups]
# Development tooling. ruff handles both formatting and linting, ty performs
# static type checking, and pytest runs the test suite. meson and ninja are
# also needed here, not only as build-system requirements: a meson-python
# editable install re-runs `meson compile` on every import to pick up source
# changes, and that subprocess call resolves `meson` from whatever is on PATH
# in this environment, not from the isolated build environment used for the
# initial build. Without a matching meson here, that rebuild either fails to
# find meson at all or, worse, finds an unrelated system-wide install whose
# version does not match the one that configured the build directory.
dev = [
    "meson>=1.2.3",
    "meson-python>=0.16",
    "mkdocstrings-python>=2.0.5",
    "ninja>=1.11",
    # meson-python needs patchelf to rewrite the extension's RPATH to point at
    # the bundled JLL shared libraries during a real (non-editable) install
    # (see mesonpy._rpath.fix_rpath). It normally requests this dynamically
    # as a build dependency when missing, but no-build-isolation-package
    # below means that request is never honored, so it must be present here.
    "patchelf>=0.11; sys_platform == 'linux'",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-markdown-docs>=0.9.2",
    "ruff>=0.6",
    "stubgen-pyx>=0.2.16",
    "ty>=0.0.1a1",
    "zensical>=0.0.50",
]

[tool.uv]
# Build cyhighs itself using this same environment's meson/ninja/cython
# rather than a separate isolated build environment, so the meson version
# that configures the build directory is guaranteed to be the same one the
# editable install's rebuild-on-import hook later calls, see the dev group
# comment above.
no-build-isolation-package = ["cyhighs"]

[tool.pytest.ini_options]
# The docs directory is included so that the Markdown code examples are collected
# and executed by pytest-markdown-docs. The superfences syntax matches the fenced
# code blocks produced by the Zensical (Material) theme, so continuation blocks
# are written as ```{.python continuation}.
testpaths = ["tests", "docs"]
addopts = "-ra --markdown-docs --markdown-docs-syntax=superfences"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# subprojects/packagefiles holds meson-jll's generated per-platform meson.build
# overlays and helper scripts (see meson-jll.lock), not code this project
# authors or maintains.
extend-exclude = ["subprojects"]

[tool.ruff.lint]
# Enable a broad, useful rule set. E and W are pycodestyle, F is pyflakes, I is
# import sorting, UP is pyupgrade, B is bugbear, and D is pydocstyle so that the
# heavy documentation requirement is enforced.
select = ["E", "W", "F", "I", "UP", "B", "D"]
# D203 and D213 conflict with the chosen docstring conventions, and D107 would
# demand a docstring on every __init__ which the class docstring already covers.
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests do not need module and function docstrings on every item.
"tests/*" = ["D100", "D103", "D104"]
# The benchmark suite follows the same relaxed docstring rules as the tests.
"benchmarks/*" = ["D103", "D104"]

[tool.ty.rules]
# scipy and the compiled extension module do not ship complete type stubs, so
# unresolved attributes on those are expected and should not fail the check.
unresolved-import = "ignore"
