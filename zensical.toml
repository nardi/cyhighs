[project]

site_name = "cyhighs"
site_description = "Cython bindings to the HiGHS linear and mixed integer optimization solver."
site_author = "Nardi Lam"
site_url = "https://nardi.github.io/cyhighs/"

repo_url = "https://github.com/nardi/cyhighs"
repo_name = "nardi/cyhighs"

copyright = """
Copyright &copy; 2026 Nardi Lam
"""

# The navigation is defined explicitly so that the User Guide reads in a
# deliberate order and the API Reference sits in its own section.
nav = [
  { "Home" = "index.md" },
  { "User Guide" = [
    { "What is cyhighs" = "guide/what-is-cyhighs.md" },
    { "How HiGHS is bundled" = "guide/bundling.md" },
    { "Installation" = "guide/installation.md" },
    { "Options" = "guide/options.md" },
    { "Solver interfaces" = [
      { "Array interface" = "guide/array-interface.md" },
      { "Sparse interface" = "guide/sparse-interface.md" },
      { "linprog interface" = "guide/linprog-interface.md" },
    ] },
  ] },
  { "API Reference" = "reference/index.md" },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

language = "en"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/nardi/cyhighs"

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
# The mkdocstrings plugin renders the API Reference from the package docstrings.
# The python handler reads the source under src, and the docstrings are written
# in Google style with Markdown formatting.
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
merge_init_into_class = true

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
